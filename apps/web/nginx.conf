server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Logo-Uploads (API-Limit 2 MB) mit etwas Puffer zulassen.
    client_max_body_size 5m;

    # Gebaute Assets aggressiv cachen (Vite haengt Content-Hashes an).
    location /assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Docker-eingebetteter DNS. Durch die Variable in proxy_pass loest nginx
    # den API-Container zur Laufzeit auf (nicht nur beim Start) - so bleiben
    # Updates des API-Containers (neue IP) ohne Web-Neustart erreichbar und
    # nginx startet auch, wenn die API kurz nicht aufloesbar ist.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API-Aufrufe an den API-Container weiterreichen (Single-Domain-Setup).
    location /api/ {
        set $api_upstream http://create-api:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hochgeladene Logos werden statisch von der API ausgeliefert.
    location /uploads/ {
        set $api_upstream http://create-api:3000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-Fallback: Client-Routen (z. B. /suche, /admin/...) an index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
